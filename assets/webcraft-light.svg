<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 280" role="img" aria-label="WebCraft — full-stack web app builder">
  <title>WebCraft — Build full-stack apps from a description</title>
  <defs>
    <style>
      .bg { fill: #F6F8FA; }

      /* Prompt types in */
      .p1  { animation: charIn 11s 0.2s  ease-out infinite; opacity:0; }
      .p2  { animation: charIn 11s 0.35s ease-out infinite; opacity:0; }
      .p3  { animation: charIn 11s 0.5s  ease-out infinite; opacity:0; }
      .p4  { animation: charIn 11s 0.65s ease-out infinite; opacity:0; }
      .p5  { animation: charIn 11s 0.8s  ease-out infinite; opacity:0; }
      .p6  { animation: charIn 11s 0.95s ease-out infinite; opacity:0; }
      .p7  { animation: charIn 11s 1.1s  ease-out infinite; opacity:0; }
      .p8  { animation: charIn 11s 1.25s ease-out infinite; opacity:0; }
      .p9  { animation: charIn 11s 1.4s  ease-out infinite; opacity:0; }
      .p10 { animation: charIn 11s 1.55s ease-out infinite; opacity:0; }
      .p11 { animation: charIn 11s 1.7s  ease-out infinite; opacity:0; }
      .p12 { animation: charIn 11s 1.85s ease-out infinite; opacity:0; }
      .p13 { animation: charIn 11s 2.0s  ease-out infinite; opacity:0; }
      .p14 { animation: charIn 11s 2.15s ease-out infinite; opacity:0; }
      .p15 { animation: charIn 11s 2.3s  ease-out infinite; opacity:0; }
      .p16 { animation: charIn 11s 2.45s ease-out infinite; opacity:0; }
      .p17 { animation: charIn 11s 2.6s  ease-out infinite; opacity:0; }
      .p18 { animation: charIn 11s 2.75s ease-out infinite; opacity:0; }
      .p19 { animation: charIn 11s 2.9s  ease-out infinite; opacity:0; }
      .p20 { animation: charIn 11s 3.05s ease-out infinite; opacity:0; }
      @keyframes charIn { 0%,1%{opacity:0} 5%,100%{opacity:1} }

      /* Input cursor */
      .icursor { animation: iblink 0.7s step-end infinite; }
      @keyframes iblink { 0%,100%{opacity:1} 50%{opacity:0} }

      /* File tree items appear one by one */
      .f1  { animation: fileIn 11s 3.8s  ease-out infinite; opacity:0; }
      .f2  { animation: fileIn 11s 4.3s  ease-out infinite; opacity:0; }
      .f3  { animation: fileIn 11s 4.8s  ease-out infinite; opacity:0; }
      .f4  { animation: fileIn 11s 5.3s  ease-out infinite; opacity:0; }
      .f5  { animation: fileIn 11s 5.8s  ease-out infinite; opacity:0; }
      .f6  { animation: fileIn 11s 6.3s  ease-out infinite; opacity:0; }
      .f7  { animation: fileIn 11s 6.8s  ease-out infinite; opacity:0; }
      .f8  { animation: fileIn 11s 7.3s  ease-out infinite; opacity:0; }
      @keyframes fileIn {
        0%,1%   { opacity:0; transform:translateX(-8px); }
        6%,100% { opacity:1; transform:translateX(0); }
      }

      /* Preview panel slides in */
      .preview { animation: slideIn 11s 8s ease-out infinite; opacity:0; }
      @keyframes slideIn {
        0%,72%  { opacity:0; transform:translateX(20px); }
        78%,100%{ opacity:1; transform:translateX(0); }
      }

      /* Sandbox button pulse */
      .sandbox-btn { animation: sandboxPulse 11s ease-out infinite; }
      @keyframes sandboxPulse {
        0%,70%   { fill: #E5E7EB; }
        74%      { fill: #059669; transform:scale(1.04); }
        78%,100% { fill: #059669; transform:scale(1); }
      }
      .sandbox-text { animation: sandboxText 11s ease-out infinite; fill: #6B7280; }
      @keyframes sandboxText {
        0%,70%   { fill: #6B7280; }
        74%,100% { fill: #FFFFFF; }
      }

      /* Diff highlight on code line */
      .diff-add { animation: diffShow 11s ease-out infinite; opacity:0; }
      @keyframes diffShow {
        0%,60%  { opacity:0; }
        65%,100%{ opacity:1; }
      }
    </style>
  </defs>

  <!-- Background -->
  <rect class="bg" width="800" height="280" rx="12"/>

  <!-- Section label -->
  <text x="32" y="36" font-family="Inter, sans-serif" font-size="11" font-weight="600" fill="#059669" letter-spacing="1">WEBCRAFT</text>
  <text x="32" y="56" font-family="Inter, sans-serif" font-size="20" font-weight="700" fill="#1F2328">Full-stack app from a sentence</text>
  <text x="32" y="76" font-family="Inter, sans-serif" font-size="13" fill="#59636E">Express.js · PostgreSQL · JWT auth · live sandbox · chat to modify</text>

  <!-- Input prompt -->
  <rect x="32" y="88" width="736" height="30" rx="8" fill="#FFFFFF" stroke="#D1D9E0" stroke-width="1"/>
  <text x="44" y="108" font-family="Inter, sans-serif" font-size="12" fill="#9CA3AF">Describe your project...</text>

  <!-- Typed prompt characters -->
  <g font-family="JetBrains Mono, monospace" font-size="12" fill="#1F2328">
    <text class="p1"  x="44"  y="108">B</text>
    <text class="p2"  x="52"  y="108">u</text>
    <text class="p3"  x="60"  y="108">i</text>
    <text class="p4"  x="65"  y="108">l</text>
    <text class="p5"  x="70"  y="108">d</text>
    <text class="p6"  x="78"  y="108"> </text>
    <text class="p7"  x="82"  y="108">a</text>
    <text class="p8"  x="90"  y="108"> </text>
    <text class="p9"  x="94"  y="108">S</text>
    <text class="p10" x="102" y="108">a</text>
    <text class="p11" x="110" y="108">a</text>
    <text class="p12" x="118" y="108">S</text>
    <text class="p13" x="126" y="108"> </text>
    <text class="p14" x="130" y="108">s</text>
    <text class="p15" x="137" y="108">t</text>
    <text class="p16" x="143" y="108">a</text>
    <text class="p17" x="151" y="108">r</text>
    <text class="p18" x="156" y="108">t</text>
    <text class="p19" x="162" y="108">e</text>
    <text class="p20" x="170" y="108">r with auth &amp; billing</text>
  </g>
  <rect class="icursor" x="336" y="96" width="1.5" height="14" fill="#059669"/>

  <!-- File tree panel -->
  <rect x="32" y="128" width="200" height="136" rx="8" fill="#1F2328"/>
  <text x="44" y="146" font-family="Inter, sans-serif" font-size="10" fill="#6B7280">PROJECT FILES</text>

  <g font-family="JetBrains Mono, monospace" font-size="10">
    <text class="f1" x="44" y="162" fill="#A78BFA">📁 server/</text>
    <text class="f2" x="56" y="176" fill="#86EFAC">  index.js</text>
    <text class="f3" x="56" y="190" fill="#86EFAC">  routes/auth.js</text>
    <text class="f4" x="56" y="204" fill="#86EFAC">  middleware/jwt.js</text>
    <text class="f5" x="44" y="218" fill="#A78BFA">📁 public/</text>
    <text class="f6" x="56" y="232" fill="#93C5FD">  index.html</text>
    <text class="f7" x="44" y="246" fill="#FCD34D">  .env.example</text>
    <text class="f8" x="44" y="260" fill="#6B7280">  package.json</text>
  </g>

  <!-- Code editor panel -->
  <rect x="242" y="128" width="310" height="136" rx="8" fill="#0D1117"/>
  <text x="254" y="146" font-family="JetBrains Mono, monospace" font-size="9" fill="#6B7280">server/routes/auth.js</text>

  <g font-family="JetBrains Mono, monospace" font-size="10">
    <text x="254" y="162" fill="#FF7B72">const</text>
    <text x="290" y="162" fill="#E6EDF3"> jwt = require(</text>
    <text x="385" y="162" fill="#A5D6FF">'jsonwebtoken'</text>
    <text x="483" y="162" fill="#E6EDF3">);</text>

    <text x="254" y="178" fill="#FF7B72">const</text>
    <text x="290" y="178" fill="#E6EDF3"> bcrypt = require(</text>
    <text x="395" y="178" fill="#A5D6FF">'bcrypt'</text>
    <text x="443" y="178" fill="#E6EDF3">);</text>

    <text x="254" y="194" fill="#7EE787">router</text>
    <text x="296" y="194" fill="#E6EDF3">.post(</text>
    <text x="330" y="194" fill="#A5D6FF">'/login'</text>
    <text x="376" y="194" fill="#E6EDF3">, async (req, res) =&gt; {'{'}...</text>

    <!-- Diff add line -->
    <rect class="diff-add" x="242" y="202" width="310" height="14" fill="#1A4731" rx="2"/>
    <text class="diff-add" x="248" y="213" fill="#4ADE80">+  const token = jwt.sign({'{'}id: user.id{'}'}, SECRET, {'{'}expiresIn:'7d'{'}'});</text>
  </g>

  <!-- Preview / sandbox panel -->
  <g class="preview">
    <rect x="562" y="128" width="206" height="136" rx="8" fill="#FFFFFF" stroke="#D1D9E0" stroke-width="1"/>
    <text x="574" y="146" font-family="Inter, sans-serif" font-size="10" fill="#6B7280">SANDBOX PREVIEW</text>
    <!-- Mini browser mockup -->
    <rect x="574" y="152" width="182" height="100" rx="4" fill="#F9FAFB" stroke="#E5E7EB" stroke-width="1"/>
    <rect x="574" y="152" width="182" height="18" rx="4" fill="#E5E7EB"/>
    <rect x="578" y="157" width="90" height="8" rx="3" fill="#D1D9E0"/>
    <!-- Login form mockup -->
    <rect x="600" y="182" width="130" height="16" rx="3" fill="#E5E7EB"/>
    <rect x="600" y="204" width="130" height="16" rx="3" fill="#E5E7EB"/>
    <rect class="sandbox-btn" x="615" y="226" width="100" height="18" rx="4"/>
    <text class="sandbox-text" x="665" y="239" text-anchor="middle" font-family="Inter, sans-serif" font-size="10" font-weight="600">▶ Running :3000</text>
  </g>
</svg>
