<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 260">
  <title>NHA Chat — Ask anything, get a specialist answer</title>
  <rect width="800" height="260" rx="12" fill="#0D1117"/>
  <!-- Header text -->
  <text x="32" y="34" font-family="Inter,-apple-system,sans-serif" font-size="11" font-weight="600" fill="#A78BFA" letter-spacing="1">CHAT</text>
  <text x="32" y="54" font-family="Inter,-apple-system,sans-serif" font-size="20" font-weight="700" fill="#E6EDF3">Ask anything. Get a specialist.</text>
  <text x="32" y="72" font-family="Inter,-apple-system,sans-serif" font-size="12" fill="#8B949E">38 expert agents · Liara free AI · streams in real time</text>
  <!-- Chat window chrome -->
  <rect x="32" y="84" width="736" height="164" rx="10" fill="#161B22" stroke="#30363D" stroke-width="1"/>
  <rect x="32" y="84" width="736" height="30" rx="10" fill="#010409"/>
  <rect x="32" y="98" width="736" height="16" fill="#010409"/>
  <circle cx="50" cy="99" r="5" fill="#FF5F57"/>
  <circle cx="66" cy="99" r="5" fill="#FFBD2E"/>
  <circle cx="82" cy="99" r="5" fill="#28CA41"/>
  <text x="400" y="103" text-anchor="middle" font-family="Inter,-apple-system,sans-serif" font-size="10" fill="#6B7280">3rdArm — NHA</text>
  <!-- Agent badge (fades in) -->
  <rect x="44" y="122" width="60" height="18" rx="5" fill="#7C3AED" opacity="0">
    <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.5;0.55;1" dur="9s" repeatCount="indefinite"/>
  </rect>
  <text x="74" y="135" text-anchor="middle" font-family="Inter,-apple-system,sans-serif" font-size="10" font-weight="700" fill="#FFFFFF" opacity="0">
    SABER
    <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.5;0.55;1" dur="9s" repeatCount="indefinite"/>
  </text>
  <!-- Response line 1 -->
  <text x="44" y="156" font-family="Inter,-apple-system,sans-serif" font-size="12" fill="#E6EDF3" opacity="0">
    Found 3 issues: raw SQL string concatenation in
    <animate attributeName="opacity" values="0;0;0;1;1" keyTimes="0;0.5;0.58;0.62;1" dur="9s" repeatCount="indefinite"/>
  </text>
  <!-- Response line 2 with red highlight -->
  <text x="44" y="174" font-family="JetBrains Mono,ui-monospace,monospace" font-size="11" fill="#FF7B72" opacity="0">
    /routes/users.js:47
    <animate attributeName="opacity" values="0;0;0;1;1" keyTimes="0;0.5;0.62;0.66;1" dur="9s" repeatCount="indefinite"/>
  </text>
  <text x="170" y="174" font-family="Inter,-apple-system,sans-serif" font-size="12" fill="#E6EDF3" opacity="0">
    — SELECT with unescaped input.
    <animate attributeName="opacity" values="0;0;0;1;1" keyTimes="0;0.5;0.62;0.66;1" dur="9s" repeatCount="indefinite"/>
  </text>
  <!-- Response line 3 -->
  <text x="44" y="192" font-family="Inter,-apple-system,sans-serif" font-size="12" fill="#E6EDF3" opacity="0">
    Fix: use
    <animate attributeName="opacity" values="0;0;0;1;1" keyTimes="0;0.5;0.66;0.70;1" dur="9s" repeatCount="indefinite"/>
  </text>
  <text x="90" y="192" font-family="JetBrains Mono,ui-monospace,monospace" font-size="11" fill="#C084FC" opacity="0">
    db.query('SELECT * WHERE id=?', [id])
    <animate attributeName="opacity" values="0;0;0;1;1" keyTimes="0;0.5;0.66;0.70;1" dur="9s" repeatCount="indefinite"/>
  </text>
  <!-- Confidence line -->
  <text x="44" y="210" font-family="Inter,-apple-system,sans-serif" font-size="11" fill="#6B7280" opacity="0">
    2 more issues detected · Confidence: 98% · Agent: SABER (security)
    <animate attributeName="opacity" values="0;0;0;1;1" keyTimes="0;0.5;0.72;0.76;1" dur="9s" repeatCount="indefinite"/>
  </text>
  <!-- Input box -->
  <rect x="44" y="220" width="620" height="22" rx="7" fill="#0D1117" stroke="#30363D" stroke-width="1"/>
  <!-- Typing text -->
  <text x="56" y="235" font-family="JetBrains Mono,ui-monospace,monospace" font-size="11" fill="#E6EDF3" opacity="0">
    Audit my Express app for SQL injection
    <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.05;0.45;0.95;1" dur="9s" repeatCount="indefinite"/>
  </text>
  <!-- blinking cursor -->
  <rect x="296" y="225" width="1.5" height="12" fill="#A78BFA">
    <animate attributeName="opacity" values="1;0;1" dur="0.8s" repeatCount="indefinite"/>
    <animate attributeName="x" values="56;296;296" keyTimes="0;0.45;1" dur="9s" repeatCount="indefinite"/>
  </rect>
  <!-- Send button -->
  <rect x="672" y="220" width="84" height="22" rx="7" fill="#21262D">
    <animate attributeName="fill" values="#21262D;#21262D;#7C3AED;#7C3AED" keyTimes="0;0.44;0.46;1" dur="9s" repeatCount="indefinite"/>
  </rect>
  <text x="714" y="235" text-anchor="middle" font-family="Inter,-apple-system,sans-serif" font-size="11" font-weight="600" fill="#6B7280">
    Send
    <animate attributeName="fill" values="#6B7280;#6B7280;#FFFFFF;#FFFFFF" keyTimes="0;0.44;0.46;1" dur="9s" repeatCount="indefinite"/>
  </text>
  <!-- thinking dots -->
  <circle cx="60" cy="148" r="3.5" fill="#A78BFA" opacity="0">
    <animate attributeName="opacity" values="0;0;1;0;0" keyTimes="0;0.46;0.50;0.54;1" dur="9s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="148;144;148" dur="0.6s" repeatCount="indefinite"/>
  </circle>
  <circle cx="74" cy="148" r="3.5" fill="#A78BFA" opacity="0">
    <animate attributeName="opacity" values="0;0;1;0;0" keyTimes="0;0.48;0.52;0.56;1" dur="9s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="148;144;148" dur="0.6s" begin="0.2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="88" cy="148" r="3.5" fill="#A78BFA" opacity="0">
    <animate attributeName="opacity" values="0;0;1;0;0" keyTimes="0;0.50;0.54;0.58;1" dur="9s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="148;144;148" dur="0.6s" begin="0.4s" repeatCount="indefinite"/>
  </circle>
</svg>
