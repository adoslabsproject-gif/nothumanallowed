<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200">
  <title>NotHumanAllowed — 38 agents, 80 tools, free AI</title>
  <rect width="800" height="200" rx="12" fill="#0D1117"/>
  <circle cx="720" cy="50" r="55" fill="#7C3AED" opacity="0.12"><animate attributeName="cy" values="50;38;50" dur="6s" repeatCount="indefinite"/></circle>
  <circle cx="755" cy="150" r="45" fill="#3572A5" opacity="0.10"><animate attributeName="cy" values="150;162;150" dur="8s" repeatCount="indefinite"/></circle>
  <circle cx="680" cy="110" r="35" fill="#059669" opacity="0.10"><animate attributeName="cx" values="680;688;680" dur="7s" repeatCount="indefinite"/></circle>
  <circle cx="60" cy="100" r="22" fill="none" stroke="#7C3AED" stroke-width="1.5"><animate attributeName="r" values="22;36;22" dur="3s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.5;0;0.5" dur="3s" repeatCount="indefinite"/></circle>
  <circle cx="60" cy="100" r="22" fill="none" stroke="#7C3AED" stroke-width="1"><animate attributeName="r" values="22;36;22" dur="3s" begin="1s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.4;0;0.4" dur="3s" begin="1s" repeatCount="indefinite"/></circle>
  <circle cx="60" cy="100" r="22" fill="#161B22"/>
  <text x="60" y="106" text-anchor="middle" font-family="Inter,-apple-system,sans-serif" font-size="12" font-weight="800" fill="#E6EDF3">NHA</text>
  <text x="100" y="88" font-family="Inter,-apple-system,sans-serif" font-size="34" font-weight="800" fill="#E6EDF3">NotHuman<tspan fill="#A78BFA">Allowed</tspan></text>
  <text x="100" y="114" font-family="Inter,-apple-system,sans-serif" font-size="13" fill="#8B949E">Your agents. Your machine. Your rules.</text>
  <rect x="100" y="130" width="80" height="22" rx="6" fill="#161B22" stroke="#30363D" stroke-width="1"/>
  <circle cx="112" cy="141" r="4" fill="#CB3837"/>
  <text x="120" y="145" font-family="Inter,-apple-system,sans-serif" font-size="10" font-weight="600" fill="#E6EDF3">v13.5.178<animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.4;0.45;0.95;1" dur="8s" repeatCount="indefinite"/></text>
  <text x="120" y="145" font-family="Inter,-apple-system,sans-serif" font-size="10" font-weight="700" fill="#CB3837" opacity="0">latest<animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.4;0.45;0.95;1" dur="8s" repeatCount="indefinite"/></text>
  <rect x="188" y="130" width="76" height="22" rx="6" fill="#161B22" stroke="#30363D" stroke-width="1"/>
  <circle cx="200" cy="141" r="4" fill="#A78BFA"/>
  <text x="208" y="145" font-family="Inter,-apple-system,sans-serif" font-size="10" font-weight="600" fill="#E6EDF3">38 agents</text>
  <rect x="272" y="130" width="68" height="22" rx="6" fill="#161B22" stroke="#30363D" stroke-width="1"/>
  <circle cx="284" cy="141" r="4" fill="#3572A5"/>
  <text x="292" y="145" font-family="Inter,-apple-system,sans-serif" font-size="10" font-weight="600" fill="#E6EDF3">80 tools</text>
  <rect x="348" y="130" width="64" height="22" rx="6" fill="#161B22" stroke="#30363D" stroke-width="1"/>
  <circle cx="360" cy="141" r="4" fill="#059669"/>
  <text x="368" y="145" font-family="Inter,-apple-system,sans-serif" font-size="10" font-weight="600" fill="#E6EDF3">free AI</text>
  <rect x="420" y="130" width="48" height="22" rx="6" fill="#161B22" stroke="#30363D" stroke-width="1"/>
  <circle cx="432" cy="141" r="4" fill="#D97706"/>
  <text x="440" y="145" font-family="Inter,-apple-system,sans-serif" font-size="10" font-weight="600" fill="#E6EDF3">MIT</text>
</svg>
